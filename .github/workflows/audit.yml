name: Cargo audit

on:
  schedule:
    # Mondays at 09:17 UTC. Off-the-hour to avoid the cron rush.
    - cron: '17 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Gating: this step fails the workflow on any unwaived advisory with a
      # fix available. Advisories that have been individually verified as
      # unreachable in Vaultic's compiled binaries are waived, with rationale,
      # in `.cargo/audit.toml` (cargo audit reads it automatically). Keep that
      # file honest — waive only what is genuinely non-applicable; upgrade
      # everything that has a fix.
      - name: Run cargo audit
        run: cargo audit
