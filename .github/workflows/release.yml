name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: vaultic-linux-x86_64
            use_cross: false
            include_gui: true
          - target: x86_64-unknown-linux-musl
            name: vaultic-linux-x86_64-musl
            use_cross: true
            include_gui: false
          - target: aarch64-unknown-linux-gnu
            name: vaultic-linux-aarch64
            use_cross: true
            include_gui: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # GUI binary needs X11 + Wayland + GL libs on the host. We only
      # ship the GUI in the native x86_64-gnu artifact; cross-built
      # musl/aarch64 artifacts contain `vaultic` + `vaultic-agent` only.
      - name: Install GUI build deps
        if: matrix.include_gui
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build with cargo (full)
        if: "!matrix.use_cross && matrix.include_gui"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build with cargo (CLI + agent only)
        if: "!matrix.use_cross && !matrix.include_gui"
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --bin vaultic --bin vaultic-agent

      - name: Build with cross (CLI + agent only)
        if: matrix.use_cross
        run: |
          cross build --release --target ${{ matrix.target }} \
            --bin vaultic --bin vaultic-agent

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.include_gui }}" = "true" ]; then
            tar czvf ../../../${{ matrix.name }}.tar.gz \
              vaultic vaultic-agent vaultic-gui
          else
            tar czvf ../../../${{ matrix.name }}.tar.gz \
              vaultic vaultic-agent
          fi
          cd ../../..
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256

  build-macos:
    name: Build macOS ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            name: vaultic-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: vaultic-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ matrix.name }}.tar.gz \
            vaultic vaultic-agent vaultic-gui
          cd ../../..
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256

  release:
    name: Create Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          find artifacts -name "*.sha256" -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          body: |
            ## Installation

            ### Homebrew (macOS/Linux)
            ```bash
            brew tap punitmishra/vaultic
            brew install vaultic
            ```

            ### Direct Download
            Download the appropriate binary for your platform from the assets below.

            ### From Source
            ```bash
            cargo install --git https://github.com/punitmishra/vaultic
            ```

            ## Quick Start
            ```bash
            vaultic init -n "My Vault"
            vaultic unlock
            vaultic add "GitHub" -u "user@example.com"
            vaultic list
            ```

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update Formula SHA256
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          # Get SHA256 values
          SHA_MACOS_ARM64=$(cat artifacts/vaultic-macos-aarch64/vaultic-macos-aarch64.tar.gz.sha256 | awk '{print $1}')
          SHA_MACOS_X86=$(cat artifacts/vaultic-macos-x86_64/vaultic-macos-x86_64.tar.gz.sha256 | awk '{print $1}')
          SHA_LINUX_ARM64=$(cat artifacts/vaultic-linux-aarch64/vaultic-linux-aarch64.tar.gz.sha256 | awk '{print $1}')
          SHA_LINUX_X86=$(cat artifacts/vaultic-linux-x86_64/vaultic-linux-x86_64.tar.gz.sha256 | awk '{print $1}')

          # Update formula
          sed -i "s/version \".*\"/version \"$VERSION\"/" Formula/vaultic.rb
          sed -i "s/PLACEHOLDER_SHA256_ARM64/$SHA_MACOS_ARM64/" Formula/vaultic.rb
          sed -i "s/PLACEHOLDER_SHA256_X86_64/$SHA_MACOS_X86/" Formula/vaultic.rb
          sed -i "s/PLACEHOLDER_SHA256_LINUX_ARM64/$SHA_LINUX_ARM64/" Formula/vaultic.rb
          sed -i "s/PLACEHOLDER_SHA256_LINUX_X86_64/$SHA_LINUX_X86/" Formula/vaultic.rb

          cat Formula/vaultic.rb

      - name: Commit Formula Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vaultic.rb
          git commit -m "Update Homebrew formula for ${GITHUB_REF#refs/tags/}" || echo "No changes to commit"
          git push
