name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.short }} / ${{ matrix.features-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            short: linux
            features: ""
            features-name: default
          - os: ubuntu-latest
            short: linux
            features: "--all-features"
            features-name: all-features
          - os: macos-latest
            short: macos
            features: ""
            features-name: default
          # macOS does NOT run --all-features. Brew's `nettle` formula
          # tracks the latest upstream (4.x), and `nettle-sys 2.3.2`
          # (pulled by sequoia-openpgp under --features gpg) still
          # targets nettle 3.x headers, so the build fails on
          # `bindgen-wrapper.h: fatal error: 'nettle/pgp.h' file not
          # found`. Linux's nettle-dev is still 3.x, so the gpg path
          # is exercised there. We test the `fido2` feature on macOS
          # since FIDO2 is the more important hardware-auth path
          # and macOS ships its deps via system frameworks.
          - os: macos-latest
            short: macos
            features: "--features fido2"
            features-name: fido2
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # eframe / egui need X11 + Wayland + GL on Linux to compile.
      # macOS gets these via system frameworks.
      - name: Install GUI build deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev

      - name: Install all-features deps (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.features-name == 'all-features'
        run: |
          sudo apt-get install -y libudev-dev nettle-dev libgmp-dev clang llvm pkg-config

      # macOS fido2 build uses system frameworks; no brew deps needed.
      # (The previous `brew install nettle gmp` step was for `gpg`,
      # which we no longer build on macOS — see matrix comment.)

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.features-name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.features-name }}-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.features-name == 'default'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

      - name: Run tests
        run: cargo test ${{ matrix.features }} --verbose

      - name: Build release
        run: cargo build --release ${{ matrix.features }}

  # Nix is intentionally not part of per-PR CI. nixpkgs' default crate
  # fetcher periodically gets 403'd by crates.io (User-Agent / IP
  # reputation), so a soft check here ended up red on every commit
  # for reasons unrelated to our code. The flake remains validated
  # locally via `nix develop` and `nix build`, and the dedicated
  # `.github/workflows/nix.yml` workflow can be run manually from the
  # Actions tab when needed.
