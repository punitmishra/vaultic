name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.short }} / ${{ matrix.features-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            short: linux
            features: ""
            features-name: default
          - os: ubuntu-latest
            short: linux
            features: "--all-features"
            features-name: all-features
          - os: macos-latest
            short: macos
            features: ""
            features-name: default
          - os: macos-latest
            short: macos
            features: "--all-features"
            features-name: all-features
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # eframe / egui need X11 + Wayland + GL on Linux to compile.
      # macOS gets these via system frameworks.
      - name: Install GUI build deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev

      - name: Install all-features deps (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.features-name == 'all-features'
        run: |
          sudo apt-get install -y libudev-dev nettle-dev libgmp-dev clang llvm pkg-config

      - name: Install all-features deps (macOS)
        if: matrix.os == 'macos-latest' && matrix.features-name == 'all-features'
        run: brew install nettle gmp pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.features-name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.features-name }}-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.features-name == 'default'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

      - name: Run tests
        run: cargo test ${{ matrix.features }} --verbose

      - name: Build release
        run: cargo build --release ${{ matrix.features }}

  nix:
    name: Nix Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build with Nix
        run: nix build --print-build-logs

      - name: Build minimal
        run: nix build .#minimal --print-build-logs
