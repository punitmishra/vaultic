# cargo-audit configuration
#
# This file waives specific RUSTSEC advisories that have been individually
# verified as NOT applicable to Vaultic as built. Every entry is justified
# below; an advisory is only listed here if it is genuinely unreachable in our
# compiled binaries, never merely to silence noise. Advisories with an
# available fix are upgraded (see Cargo.lock), not waived.
#
# Re-verify this list whenever dependencies change: `cargo audit` without the
# ignores (`cargo audit --ignore-config` or by commenting these out) shows the
# full set, and `cargo tree -i <crate>` shows whether a crate is actually
# compiled in.

[advisories]
ignore = [
    # rmcp — DNS-rebinding in the *Streamable HTTP* server transport.
    # vaultic-mcp speaks MCP over stdio only: src/bin/vaultic_mcp.rs builds its
    # server with `rmcp::transport::io::stdio()` and never constructs the
    # Streamable-HTTP transport the advisory concerns. No HTTP listener exists,
    # so the rebinding vector is unreachable. No upstream fix is available.
    "RUSTSEC-2026-0189",

    # quinn-proto / quinn-udp — QUIC panics / memory-exhaustion in the QUIC
    # transport. These crates are pulled into Cargo.lock only through reqwest's
    # OPTIONAL HTTP/3 feature, which Vaultic does not enable. They are not
    # compiled into any binary: `cargo tree -i quinn-proto` and
    # `cargo tree -i quinn-udp` both report "nothing to print". Vaultic's only
    # network use is outbound HTTPS (HIBP, Ollama) over the default TCP/TLS
    # stack; no code path reaches QUIC. No upstream fix is available.
    "RUSTSEC-2026-0338",
    "RUSTSEC-2026-0339",
    "RUSTSEC-2026-0340",
    "RUSTSEC-2026-0341",
    "RUSTSEC-2026-0342",
    "RUSTSEC-2026-0523",
    "RUSTSEC-2026-0524",
    "RUSTSEC-2026-0538",

    # url — stack overflow in `Url::origin()` on deeply nested `blob:` URLs.
    # `url` is a transitive dependency (via reqwest) used only to parse the
    # controlled HIBP / Ollama endpoint URLs; Vaultic never calls
    # `Url::origin()` (grep: no `.origin()` call sites) and never parses
    # untrusted `blob:` URLs. No upstream fix is available yet; re-check on the
    # next `url` release and drop this waiver once patched.
    "RUSTSEC-2026-0592",
]
